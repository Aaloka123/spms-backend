# AUTH DATABASE
spring.datasource.auth.url=jdbc:mysql://localhost:3306/spms_auth_db?createDatabaseIfNotExist=true
spring.datasource.auth.username=root
spring.datasource.auth.password=root
spring.datasource.auth.driver-class-name=com.mysql.cj.jdbc.Driver

# AUTH HikariCP (standard)
spring.datasource.auth.hikari.pool-name=AuthHikariPool
spring.datasource.auth.hikari.maximum-pool-size=10
spring.datasource.auth.hikari.minimum-idle=10
spring.datasource.auth.hikari.connection-timeout=30000
spring.datasource.auth.hikari.idle-timeout=600000
spring.datasource.auth.hikari.max-lifetime=1800000

# APP DATABASE
spring.datasource.app.url=jdbc:mysql://localhost:3306/spms_db?createDatabaseIfNotExist=true
spring.datasource.app.username=root
spring.datasource.app.password=root
spring.datasource.app.driver-class-name=com.mysql.cj.jdbc.Driver

# APP HikariCP (standard)
spring.datasource.app.hikari.pool-name=AppHikariPool
spring.datasource.app.hikari.maximum-pool-size=10
spring.datasource.app.hikari.minimum-idle=10
spring.datasource.app.hikari.connection-timeout=30000
spring.datasource.app.hikari.idle-timeout=600000
spring.datasource.app.hikari.max-lifetime=1800000

# Disable single-datasource auto config
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
# JWT
jwt.secret=spms-jwt-secret-key-must-be-at-least-256-bits-long-for-hs256
jwt.expiration=86400000

# OTP validity in minutes (default 30)
spms.otp.ttl-minutes=30

# Gmail SMTP (use App Password, not your real Gmail password)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_USER:your-email@gmail.com}
spring.mail.password=${EMAIL_PASS:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Optional: shown as "from"
spms.mail.from=${EMAIL_USER:your-email@gmail.com}